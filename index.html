<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What Do Management Signals Reveal?</title>
<meta name="description" content="What Do Management Signals Reveal? Organizational Positioning and Outcomes in Project-Based Markets. The firms behind the study: which U.S. project-based firms display two management credentials, professional institute membership and website references to lean project delivery, where they are, which practices they name, and since when. Every firm links to its sources.">
<link rel="preload" href="data/summary.json?v=23" as="fetch" crossorigin>
<link rel="preload" href="data/orgs.json?v=23" as="fetch" crossorigin>
<link rel="preload" href="data/us-states.json?v=23" as="fetch" crossorigin>
<link rel="stylesheet" href="css/app.css?v=23">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
</head>
<body>
<header class="site">
  <div class="title">
    <h1>What Do Management Signals Reveal?</h1>
    <p class="sub" id="subtitle">Organizational Positioning and Outcomes in Project-Based Markets</p>
  </div>
  <nav class="tabs" id="tabs">
    <a href="#landscape" data-tab="landscape">Map</a>
    <a href="#organizations" data-tab="organizations">Firms</a>
    <a href="#methods" data-tab="methods">Practices</a>
    <a href="#data" data-tab="data">Data</a>
  </nav>
</header>

<main id="main">
  <section id="p-landscape" class="view">
    <div class="hero">
      <div class="hero-map">
        <div class="map-wrap"><svg id="hero-svg" viewBox="0 0 975 610" aria-label="Map of the firms"></svg><button class="pill mapplay" id="hero-play">Pause</button></div>
        <div class="map-controls">
          <div class="maplegend" id="hero-legend"></div>
          <div class="chips" id="hero-groups">
            <button class="chip on" data-g="lci">Institute members</button>
            <button class="chip on" data-g="enr">Ranked firms, not members</button>
            <button class="chip on" data-g="fed">Other federal award recipients</button>
          </div>
          <div class="yearbar" id="hero-yearbar" hidden>
            <span class="ylab">2008</span><input type="range" id="hero-year" min="2008" max="2026" value="2026"><span class="ylab">2026</span>
            <span class="yval" id="hero-year-val">2026</span>
          </div>
        </div>
      </div>
      <div class="hero-side">
        <aside class="readout" id="hero-readout">
          <div class="step" id="hero-step">The firms</div>
          <div class="bignums" id="hero-nums"></div>
          <div class="steps" id="hero-mode">
            <button class="chip on" data-m="all">All firms</button>
            <button class="chip" data-m="observed">Website read</button>
            <button class="chip" data-m="lean">Website references to lean practices</button>
            <button class="chip" data-m="method">Named practices</button>
            <button class="chip" data-m="year">First observed commitment, by year</button>
          </div>
          <p class="note" id="hero-note"></p>
        </aside>
      </div>
    </div>
  </section>

  <section id="p-organizations" class="view" hidden>
    <div class="toolbar">
      <input type="search" id="org-search" placeholder="Name, domain, city or state">
      <div class="chips" id="org-groups">
        <button class="chip on" data-g="lci">Institute members</button>
        <button class="chip on" data-g="enr">Ranked firms, not members</button>
        <button class="chip on" data-g="fed">Other federal award recipients</button>
      </div>
      <select id="org-level">
        <option value="any">Any website status</option>
        <option value="observed">Website read</option>
        <option value="lean">References lean practices</option>
        <option value="method">Names a practice</option>
        <option value="dated">Dated commitment</option>
        <option value="none">Read, no lean reference</option>
      </select>
      <select id="org-type"><option value="">All organization types</option></select>
      <select id="org-state"><option value="">All states</option></select>
      <span class="count" id="org-count"></span>
      <button class="pill" id="org-download">Download the list (CSV)</button>
    </div>
    <div class="orgs">
      <div class="orglist" id="org-list"></div>
      <div class="orgdetail" id="org-detail"><p class="muted">Select a firm.</p></div>
    </div>
  </section>

  <section id="p-methods" class="view" hidden>
    <div class="chips" id="meth-groups">
      <button class="chip on lci" data-g="lci">Institute members</button>
      <button class="chip on enr" data-g="enr">Ranked firms, not members</button>
      <button class="chip on fed" data-g="fed">Other federal award recipients</button>
    </div>
    <div class="grid2 cols">
      <figure class="card">
        <figcaption>Practices named together by the same firm</figcaption>
        <div id="fig-cooc"></div>
        <p class="fine">Any archived page of the firm, 2008 to 2026. Diagonal: firms naming the practice; off the diagonal: firms naming both. Practices named by 3 or more firms in the chosen groups. Click a circle to list the firms.</p>
      </figure>
      <div class="card" id="meth-list"></div>
    </div>
  </section>

  <section id="p-data" class="view" hidden>
    <div class="card prose" id="data-body"></div>
    <details class="card more" id="more-figs">
      <summary>More figures</summary>
      <div class="masonry">
        <figure class="card">
          <figcaption>Website references to lean practices, by group</figcaption>
          <div id="fig-groups"></div>
          <p class="fine">Firms whose archived website was read (2008 to 2026 for the federal award recipients of the panel; 2024 to 2026 for the rest). Website measures capture public communication, not verified implementation.</p>
        </figure>
        <figure class="card">
          <figcaption>Lean practices named on corporate websites, firms per practice</figcaption>
          <div id="fig-practices"></div>
          <p class="fine">Any archived page of the firm, 2008 to 2026, all three groups. Named practices count on their own; general planning and improvement tools (grey labels) count only on a page that also carries a general lean reference or a named practice.</p>
        </figure>
        <figure class="card">
          <figcaption>First observed public commitment to lean project delivery, by year</figcaption>
          <div id="fig-commit"></div>
          <p class="fine">Federal award recipients of the panel with a dated commitment. A commitment is dated by the first observed year with a qualifying website reference confirmed by a second page. Years without archive coverage are unknown, not zero; Common Crawl coverage starts in 2013.</p>
        </figure>
        <figure class="card">
          <figcaption>Institute membership among the ranked firms, by dominant market and by size</figcaption>
          <div id="fig-enr"></div>
          <p class="fine">Share of the ENR Top 400 firms (2025 ranking) ever listed as an LCI member (2013 to 2026) and listed in 2026, with 95% Wilson intervals.</p>
        </figure>
        <figure class="card">
          <figcaption>Institute directory: member types</figcaption>
          <div id="fig-lci-types"></div>
          <p class="fine">LCI corporate directory, 2026, by organization type; the second bar counts the members whose directory entry describes lean practice.</p>
        </figure>
        <figure class="card">
          <figcaption>Institute directory: growth by cohort</figcaption>
          <div id="fig-lci-growth"></div>
          <p class="fine">Organizations listed each year, by the year first listed (archived directories 2013 to 2026; 2018 has no archive).</p>
        </figure>
      </div>
      <figure class="card wide">
        <figcaption>Year a practice is first named, by firm (federal award recipients of the panel, 2008 to 2026)</figcaption>
        <div id="fig-firstyear"></div>
        <p class="fine">First archived year in which each firm’s site names the practice. Archive coverage is thin before 2013 and uneven after; a first year is an upper bound on when the practice was first named.</p>
      </figure>
    </details>
  </section>
</main>
<div class="tip" id="tip" hidden></div>
<footer class="site"><span id="foot"></span></footer>

<script src="js/motion.js?v=23"></script>
<script src="js/charts.js?v=23"></script>
<script src="js/usmap.js?v=23"></script>
<script src="js/landscape.js?v=23"></script>
<script src="js/organizations.js?v=23"></script>
<script src="js/methods.js?v=23"></script>
<script src="js/datatab.js?v=23"></script>
<script src="js/app.js?v=23"></script>
</body>
</html>
